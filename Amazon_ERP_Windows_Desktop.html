<style>
  :root {

    --text-muted: #94a3b8;
    --primary: #38bdf8;
    --emerald: #10b981;
    --amber: #f59e0b;
    --rose: #f43f5e;
    --purple: #a855f7;
  }
  body.light {
    --bg-main: #f1f5f9;
    --bg-card: #ffffff;
    --bg-sidebar: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: var(--bg-main); color: var(--text); display: flex; height: 100vh; overflow: hidden; user-select: none; }
  /* Sidebar */
  .sidebar { width: 275px; background: var(--bg-sidebar); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .brand { height: 70px; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
  .brand-icon { width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, #0ea5e9, #10b981); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 20px; }
  .brand-title { font-size: 14.5px; font-weight: 700; }
  .brand-sub { font-size: 11px; color: var(--emerald); }
  .nav-list { flex: 1; overflow-y: auto; padding: 10px 8px; }
  .nav-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; cursor: pointer; margin-bottom: 4px; transition: 0.15s; border: 1px solid transparent; }
  .nav-item:hover { background: rgba(56, 189, 248, 0.08); }
  .nav-item.active { background: rgba(56, 189, 248, 0.15); border-color: rgba(56, 189, 248, 0.45); }
  .nav-item-title { font-size: 13px; font-weight: 600; }
  .nav-item-sub { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; }
  .nav-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: rgba(56, 189, 248, 0.16); color: var(--primary); }
  .sidebar-footer { padding: 10px; border-top: 1px solid var(--border); display: flex; gap: 6px; }
  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { height: 70px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border); padding: 0 22px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .topbar-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { padding: 5px 11px; border-radius: 9px; font-size: 12px; font-weight: 600; border: 1px solid rgba(255,255,255,0.1); background: rgba(56,189,248,0.1); }
  .content { flex: 1; overflow-y: auto; padding: 20px; }
  /* Grid & Cards */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .kpi-title { font-size: 12.5px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
  .kpi-val { font-size: 23px; font-weight: 800; margin-bottom: 4px; }
  .kpi-sub { font-size: 11px; color: var(--text-muted); }
  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; text-align: right; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--text-muted); font-weight: 700; background: rgba(255,255,255,0.02); }
  tr:hover td { background: rgba(56, 189, 248, 0.04); }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 700; }
  .b-green { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.35); }
  .b-red { background: rgba(244,63,94,0.15); color: #f43f5e; border: 1px solid rgba(244,63,94,0.35); }
  .b-amber { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.35); }
  .b-blue { background: rgba(56,189,248,0.15); color: #38bdf8; border: 1px solid rgba(56,189,248,0.35); }
  /* Controls */
  .btn { padding: 8px 14px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); cursor: pointer; font-size: 12.5px; font-weight: 600; transition: 0.15s; }
  .btn:hover { border-color: var(--primary); }
  .btn-primary { background: #0284c7; border-color: #0ea5e9; color: #fff; }
  .btn-primary:hover { background: #0369a1; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  input, select { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-main); color: var(--text); font-size: 12.5px; }
  .mono { font-family: Consolas, monospace; cursor: pointer; }
  .mono:hover { color: var(--primary); text-decoration: underline; }
  /* Modal */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; width: 650px; max-width: 95vw; padding: 22px; max-height: 90vh; overflow-y: auto; }
  .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 11.5px; color: var(--text-muted); }
  .toast { position: fixed; bottom: 20px; left: 20px; background: #10b981; color: #fff; padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 13px; display: none; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
</style>
</head>

<div class="sidebar">
  <div class="brand">
    <div class="brand-icon">A</div>
    <div>
      <div class="brand-title">منظومة أمازون الرقمية</div>
      <div class="brand-sub">متزامن ومترابط بالكامل 🟢</div>
    </div>
  </div>
  <div class="nav-list" id="navList"></div>
  <div class="sidebar-footer">
    <button class="btn" style="flex:1" onclick="toggleTheme()">🌓 المظهر</button>

  </div>
</div>

<div class="main">
  <div class="topbar">
    <div>
      <div id="screenTitle" style="font-size:17px;font-weight:800;">التقرير التنفيذي الشامل</div>
      <div id="screenSub" style="font-size:11.5px;color:var(--text-muted);">نظرة استراتيجية شاملة للمنظومة</div>
    </div>
    <div class="topbar-pills" id="topPills"></div>
  </div>
  <div class="content" id="mainContent"></div>
</div>

<!-- نافذة إضافة حملة يومية -->
<div class="modal-backdrop" id="campaignModal">
  <div class="modal">
    <h3 style="margin-bottom:8px;">➕ تسجيل حملة يومية جديدة (تعبئة تلقائية ذكية)</h3>
    <div class="form-grid">
      <div class="form-group" style="grid-column: span 2;">
        <label>اختر المنتج (تعبئة تلقائية لبيانات الحساب)</label>
        <select id="m_product" onchange="autoFillProduct()"></select>
      </div>
      <div class="form-group">
        <label>التاريخ</label>
        <input type="date" id="m_date">
      </div>
      <div class="form-group">
        <label>المستفيد</label>
        <input type="text" id="m_beneficiary">
      </div>
      <div class="form-group">
        <label>رمز الحساب</label>
        <input type="text" id="m_code">
      </div>
      <div class="form-group">
        <label>البروفايل (GoLogin)</label>
        <input type="text" id="m_profile">
      </div>
      <div class="form-group">
        <label>تكلفة الحملة ($)</label>
        <input type="number" step="0.001" id="m_cost" value="0">
      </div>
      <div class="form-group">
        <label>عمولات أمازون ($)</label>
        <input type="number" step="0.01" id="m_comm" value="0">
      </div>
      <div class="form-group">
        <label>المكافآت الإضافية Bonus ($)</label>
        <input type="number" step="0.01" id="m_bonus" value="0">
      </div>
      <div class="form-group">
        <label>النقرات (Clicks)</label>
        <input type="number" id="m_clicks" value="0">
      </div>
      <div class="form-group">
        <label>الطلبات (Ordered)</label>
        <input type="number" id="m_orders" value="0">
      </div>
      <div class="form-group">
        <label>المشحون (Shipped)</label>
        <input type="number" id="m_shipped" value="0">
      </div>
      <div class="form-group">
        <label>إجمالي قيمة المبيعات ($)</label>
        <input type="number" step="0.01" id="m_rev" value="0">
      </div>
      <div class="form-group">
        <label>الإيميل</label>
        <input type="text" id="m_email">
      </div>
      <div class="form-group">
        <label>رابط الإعلان</label>
        <input type="text" id="m_adurl">
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;">
      <button class="btn" onclick="closeCampaignModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveNewCampaign()">حفظ الحملة وحساب العائد</button>
    </div>
  </div>
</div>

  if (!txt) return;
  navigator.clipboard.writeText(txt);
  const t = document.getElementById('toast');
  t.textContent = 'تم نسخ ' + (label || '') + ': ' + txt + ' ✅';

function badgeHtml(txt) {
  if (!txt) return '<span class="badge b-blue">غير محدد</span>';
  let cls = 'b-blue';
  if (/نشط|يعمل|كافٍ|رابحة|كرر|بنجاح|ممتازة|نعم|متاح/.test(txt)) cls = 'b-green';
  else if (/محظور|مقفول|إيقاف|منتهي|خسارة/.test(txt)) cls = 'b-red';
  else if (/مراجعة|منخفض|تعديل|انتظار|جاهز/.test(txt)) cls = 'b-amber';
  return `<span class="badge ${cls}">${txt}</span>`;
}

  } else {
    const crStr = cr > 0 ? `CR: ${(cr*100).toFixed(1)}% | ` : '';
    if (net > 0) {

    } else if (net === 0) {
      rec = crStr + (c.cost === 0 ? '⚪ حملة مجانية / تجريبية' : '⚖️ تعادل - راقب قبل التكرار');
    } else {
      const r = roi !== null ? roi : -1;
      rec = crStr + (r <= -0.8 ? '🛑 إيقاف الحملة فوراً (خسارة مرتفعة)' : (r <= -0.4 ? '🔧 تعديل الحملة (الاستهداف/الإعلان)' : '⚠️ تعديل طفيف لتحسين العائد'));
    }
  }
  return { cr, earn, net, roi, rec };
}

function getTotals() {
  const cap = db.beneficiaries.reduce((s, b) => s + (+b.baseCapital || 0), 0);
  let spend = 0, earn = 0, net = 0, sales = 0, shipped = 0;
  db.campaigns.forEach(c => {
    const m = calcCampaign(c);
    spend += (+c.cost || 0);
    earn += m.earn;
    net += m.net;
    sales += (+c.totalRevenue || 0);
    shipped += (+c.shippedItems || 0);
  });
  const roi = spend > 0 ? net / spend : 0;
  return { cap, spend, liq: cap - spend, earn, net, roi, sales, shipped };
}

  const prod = document.getElementById('m_product').value;
  const item = db.products_catalog.find(p => p.product === prod);
  if (item) {
    document.getElementById('m_beneficiary').value = item.beneficiary;

    document.getElementById('m_profile').value = item.profile;
    document.getElementById('m_email').value = item.email.split('@')[0];
    document.getElementById('m_adurl').value = item.adUrl;
  }
}

  db.campaigns.unshift({

    beneficiary: document.getElementById('m_beneficiary').value,
    accountCode: document.getElementById('m_code').value,
    product: document.getElementById('m_product').value,
    email: document.getElementById('m_email').value,
    cost: parseFloat(document.getElementById('m_cost').value) || 0,
    profile: document.getElementById('m_profile').value,
    password: '',
    clicks: parseInt(document.getElementById('m_clicks').value) || 0,
    orderedItems: parseInt(document.getElementById('m_orders').value) || 0,
    orderedRevenue: 0,
    shippedItems: parseInt(document.getElementById('m_shipped').value) || 0,
    returnedItems: 0,
    totalRevenue: parseFloat(document.getElementById('m_rev').value) || 0,
    commission: parseFloat(document.getElementById('m_comm').value) || 0,
    bonus: parseFloat(document.getElementById('m_bonus').value) || 0,
    isPending: false,
    adUrl: document.getElementById('m_adurl').value
  });
  closeCampaignModal();
  saveDb();
}

function exportCampaignsCsv() {
  const headers = ['التسلسل','التاريخ','المستفيد','رمز الحساب','المنتج','الإيميل','التكلفة','النقرات','الطلبات','المشحون','المبيعات','العمولة','المكافأة','الأرباح','صافي الربح'];
  const rows = db.campaigns.map(c => {
    const m = calcCampaign(c);
    return [c.seq, c.date, c.beneficiary, c.accountCode, c.product, c.email, c.cost, c.clicks, c.orderedItems, c.shippedItems, c.totalRevenue, c.commission, c.bonus, m.earn.toFixed(2), m.net.toFixed(3)].join(',');
  });
  const csv = '\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'amazon_campaigns_export.csv';
  a.click();
}

renderAll();
</script>
